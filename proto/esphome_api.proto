syntax = "proto3";

import "api_options.proto";

package esphome.api;

// ============================================================
// Core handshake
// ============================================================

message HelloRequest {
  string client_info = 1;
}

message HelloResponse {
  uint32 api_version_major = 1;
  uint32 api_version_minor = 2;
  string server_info = 3;
  string name = 4;
}

message ConnectRequest {
  string password = 1;
}

message ConnectResponse {
  bool invalid_password = 1;
}

message DeviceInfoRequest {
}

message DeviceInfoResponse {
  bool uses_password = 1;
  string name = 2 [(max_data_length) = 31];
  string mac_address = 3 [(max_data_length) = 17];
  string esphome_version = 4 [(max_data_length) = 32];
  string compilation_time = 5 [(max_data_length) = 25];
  string model = 6 [(max_data_length) = 127];
  bool has_deep_sleep = 7;
  string project_name = 8 [(max_data_length) = 127];
  string project_version = 9 [(max_data_length) = 127];
  uint32 webserver_port = 10;
  string manufacturer = 12 [(max_data_length) = 20];
  string friendly_name = 13 [(max_data_length) = 120];
}

// ============================================================
// Entity listing
// ============================================================

message ListEntitiesRequest {}

message EntityInfo {
  uint32 key = 1;
  string object_id = 2;
  string name = 3;
  uint32 legacy_type = 4;
}

message ListEntitiesResponse {
  repeated EntityInfo entities = 1;
}

// ============================================================
// Subscribe to states
// ============================================================

message SubscribeStatesRequest {}

message BinarySensorStateResponse {
  uint32 key = 1;
  bool state = 2;
  bool missing_state = 3;
}

message SwitchStateResponse {
  uint32 key = 1;
  bool state = 2;
}

message SensorStateResponse {
  uint32 key = 1;
  float state = 2;
  bool missing_state = 3;
}

message TextSensorStateResponse {
  uint32 key = 1;
  string state = 2 [(max_data_length) = 255];
  bool missing_state = 3;
}

// ============================================================
// Switch commands
// ============================================================

message SwitchCommandRequest {
  uint32 key = 1;
  bool state = 2;
}

// ============================================================
// Light commands (optional but included for completeness)
// ============================================================

message LightCommandRequest {
  uint32 key = 1;
  bool has_state = 2;
  bool state = 3;

  bool has_brightness = 4;
  float brightness = 5;

  bool has_color_temperature = 6;
  float color_temperature = 7;

  bool has_rgb = 8;
  float red = 9;
  float green = 10;
  float blue = 11;
}

// ============================================================
// Ping / Disconnect
// ============================================================

message PingRequest {}
message PingResponse {}

message DisconnectRequest {}
message DisconnectResponse {}

// ============================================================
// Log messages
// ============================================================

message SubscribeLogsRequest {
  bool level_debug = 1;
  bool level_info = 2;
  bool level_warn = 3;
  bool level_error = 4;
}

message LogMessage {
  string message = 1;
  uint32 level = 2;
  string tag = 3;
}

// ============================================================
// Envelope frame
// ============================================================

message Frame {
  uint32 type = 1;
  bytes payload = 2;
}
